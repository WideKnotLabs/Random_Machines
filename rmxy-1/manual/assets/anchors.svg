<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" role="img" aria-labelledby="title desc"><title id="title">Combined axis values</title><desc id="desc">The independent X and Y changes add to Base. A 20% Base, 50% X and 40% Y produces 70% at the upper-right.</desc><rect width="900" height="416" rx="8" fill="#090c0f"/><g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"><text x="30" y="37" font-size="18" fill="#eff2f6" text-anchor="start" font-weight="500">Base, X, and Y</text><rect x="60" y="96" width="330" height="255" rx="4" fill="#161d23" stroke="#444f59"/><line x1="60" y1="351" x2="390" y2="351" stroke="#00d856" stroke-width="2"/><line x1="60" y1="351" x2="60" y2="96" stroke="#4a62ff" stroke-width="2"/><text x="60" y="78" font-size="14" fill="#4a62ff" text-anchor="start" font-weight="500">Y = 40%</text><text x="390" y="78" font-size="14" fill="#eff2f6" text-anchor="end" font-weight="500">X + Y = 70%</text><text x="60" y="378" font-size="14" fill="#eff2f6" text-anchor="start" font-weight="500">Base = 20%</text><text x="390" y="378" font-size="14" fill="#00d856" text-anchor="end" font-weight="500">X = 50%</text><path d="M60,351 L390,96" stroke="#444f59" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="351" r="5" fill="#eff2f6" stroke="none" stroke-width="1"/><circle cx="390" cy="351" r="5" fill="#00d856" stroke="none" stroke-width="1"/><circle cx="60" cy="96" r="5" fill="#4a62ff" stroke="none" stroke-width="1"/><text x="470" y="120" font-size="14" fill="#9fa6ae" text-anchor="start" font-weight="500">Base</text><text x="832" y="120" font-size="21" fill="#eff2f6" text-anchor="end" font-weight="500">20%</text><line x1="470" y1="142" x2="840" y2="142" stroke="#444f59" stroke-width="1"/><text x="470" y="180" font-size="14" fill="#00d856" text-anchor="start" font-weight="500">X contribution</text><text x="832" y="180" font-size="20" fill="#eff2f6" text-anchor="end" font-weight="500">50 − 20 = 30</text><text x="470" y="230" font-size="14" fill="#4a62ff" text-anchor="start" font-weight="500">Y contribution</text><text x="832" y="230" font-size="20" fill="#eff2f6" text-anchor="end" font-weight="500">40 − 20 = 20</text><line x1="470" y1="253" x2="840" y2="253" stroke="#444f59" stroke-width="1"/><text x="470" y="290" font-size="14" fill="#9fa6ae" text-anchor="start" font-weight="500">Combined</text><text x="832" y="290" font-size="20" fill="#c9f427" text-anchor="end" font-weight="500">20 + 30 + 20 = 70%</text><text x="470" y="344" font-size="13" fill="#9fa6ae" text-anchor="start" font-weight="500">Example in normalized values.</text><text x="470" y="368" font-size="13" fill="#9fa6ae" text-anchor="start" font-weight="500">The parameter’s allowed range still applies.</text></g></svg>