<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" role="img" aria-labelledby="title desc"><title id="title">Bypass Dry routing</title><desc id="desc">Off: live source and loop reach the chain. On: the weighted live source bypasses the chain while the loop is processed.</desc><rect width="900" height="488" rx="8" fill="#090c0f"/><g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"><text x="30" y="38" font-size="18" fill="#eff2f6" text-anchor="start" font-weight="500">BYPASS DRY routing</text><rect x="30" y="75" width="168" height="32" rx="4" fill="#161d23" stroke="#444f59"/><text x="114.0" y="96" font-size="12" fill="#9fa6ae" text-anchor="middle" font-weight="600">BYPASS DRY</text><text x="30" y="139" font-size="12" fill="#9fa6ae" text-anchor="start" font-weight="500">LIVE SOURCE</text><text x="30" y="193" font-size="12" fill="#9fa6ae" text-anchor="start" font-weight="500">RECORDED LOOP</text><rect x="376" y="118" width="164" height="87" rx="4" fill="#161d23" stroke="#444f59"/><text x="458" y="167" font-size="13" fill="#eff2f6" text-anchor="middle" font-weight="500">FX CHAIN</text><rect x="716" y="118" width="146" height="87" rx="4" fill="#161d23" stroke="#444f59"/><text x="789" y="167" font-size="13" fill="#eff2f6" text-anchor="middle" font-weight="500">OUTPUT</text><path d="M208,188 H376 M540,161 H716" stroke="#c9f427" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M208,134 H376" stroke="#eff2f6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="255" width="168" height="32" rx="4" fill="#161d23" stroke="#c9f427"/><text x="114.0" y="276" font-size="12" fill="#c9f427" text-anchor="middle" font-weight="600">BYPASS DRY</text><text x="30" y="319" font-size="12" fill="#9fa6ae" text-anchor="start" font-weight="500">LIVE SOURCE</text><text x="30" y="373" font-size="12" fill="#9fa6ae" text-anchor="start" font-weight="500">RECORDED LOOP</text><rect x="376" y="298" width="164" height="87" rx="4" fill="#161d23" stroke="#444f59"/><text x="458" y="347" font-size="13" fill="#eff2f6" text-anchor="middle" font-weight="500">FX CHAIN</text><rect x="716" y="298" width="146" height="87" rx="4" fill="#161d23" stroke="#444f59"/><text x="789" y="347" font-size="13" fill="#eff2f6" text-anchor="middle" font-weight="500">OUTPUT</text><path d="M208,368 H376 M540,341 H716" stroke="#c9f427" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M208,314 H272 V265 H789 V298" stroke="#eff2f6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="459" font-size="14" fill="#9fa6ae" text-anchor="start" font-weight="500">Loop Dry/Wet sets the live/loop balance in both states.</text></g></svg>