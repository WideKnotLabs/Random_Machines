<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 339" role="img" aria-labelledby="title desc"><title id="title">Response curves</title><desc id="desc">Three positions on the continuous LOG–LIN–EXP curve control change the route to the same target.</desc><rect width="900" height="339" rx="8" fill="#090c0f"/><g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"><text x="30" y="38" font-size="18" fill="#eff2f6" text-anchor="start" font-weight="500">Axis response curves</text><rect x="30" y="65" width="256" height="165" rx="4" fill="#161d23" stroke="#444f59"/><line x1="94" y1="65" x2="94" y2="230" stroke="#29343d" stroke-width="1"/><line x1="158" y1="65" x2="158" y2="230" stroke="#29343d" stroke-width="1"/><line x1="222" y1="65" x2="222" y2="230" stroke="#29343d" stroke-width="1"/><path d="M38,222 Q65,74 278,74" stroke="#00d856" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="222" r="4" fill="#eff2f6" stroke="none" stroke-width="1"/><circle cx="278" cy="74" r="4" fill="#00d856" stroke="none" stroke-width="1"/><text x="38" y="258" font-size="9" fill="#9fa6ae" text-anchor="start" font-weight="500">LOG</text><text x="158.0" y="258" font-size="9" fill="#9fa6ae" text-anchor="middle" font-weight="500">LIN</text><text x="278" y="258" font-size="9" fill="#9fa6ae" text-anchor="end" font-weight="500">EXP</text><line x1="38" y1="271" x2="278" y2="271" stroke="#444f59" stroke-width="3"/><circle cx="38.0" cy="271" r="4" fill="#00d856" stroke="none" stroke-width="1"/><text x="30" y="310" font-size="13" fill="#9fa6ae" text-anchor="start" font-weight="500">Most change near Base</text><rect x="322" y="65" width="256" height="165" rx="4" fill="#161d23" stroke="#444f59"/><line x1="386" y1="65" x2="386" y2="230" stroke="#29343d" stroke-width="1"/><line x1="450" y1="65" x2="450" y2="230" stroke="#29343d" stroke-width="1"/><line x1="514" y1="65" x2="514" y2="230" stroke="#29343d" stroke-width="1"/><path d="M330,222 L570,74" stroke="#00d856" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="222" r="4" fill="#eff2f6" stroke="none" stroke-width="1"/><circle cx="570" cy="74" r="4" fill="#00d856" stroke="none" stroke-width="1"/><text x="330" y="258" font-size="9" fill="#9fa6ae" text-anchor="start" font-weight="500">LOG</text><text x="450.0" y="258" font-size="9" fill="#9fa6ae" text-anchor="middle" font-weight="500">LIN</text><text x="570" y="258" font-size="9" fill="#9fa6ae" text-anchor="end" font-weight="500">EXP</text><line x1="330" y1="271" x2="570" y2="271" stroke="#444f59" stroke-width="3"/><circle cx="450.0" cy="271" r="4" fill="#00d856" stroke="none" stroke-width="1"/><text x="322" y="310" font-size="13" fill="#9fa6ae" text-anchor="start" font-weight="500">Even change</text><rect x="614" y="65" width="256" height="165" rx="4" fill="#161d23" stroke="#444f59"/><line x1="678" y1="65" x2="678" y2="230" stroke="#29343d" stroke-width="1"/><line x1="742" y1="65" x2="742" y2="230" stroke="#29343d" stroke-width="1"/><line x1="806" y1="65" x2="806" y2="230" stroke="#29343d" stroke-width="1"/><path d="M622,222 Q834,222 862,74" stroke="#00d856" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="622" cy="222" r="4" fill="#eff2f6" stroke="none" stroke-width="1"/><circle cx="862" cy="74" r="4" fill="#00d856" stroke="none" stroke-width="1"/><text x="622" y="258" font-size="9" fill="#9fa6ae" text-anchor="start" font-weight="500">LOG</text><text x="742.0" y="258" font-size="9" fill="#9fa6ae" text-anchor="middle" font-weight="500">LIN</text><text x="862" y="258" font-size="9" fill="#9fa6ae" text-anchor="end" font-weight="500">EXP</text><line x1="622" y1="271" x2="862" y2="271" stroke="#444f59" stroke-width="3"/><circle cx="862.0" cy="271" r="4" fill="#00d856" stroke="none" stroke-width="1"/><text x="614" y="310" font-size="13" fill="#9fa6ae" text-anchor="start" font-weight="500">Most change near the target